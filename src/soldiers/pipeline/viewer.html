<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}</style></head><body>
<script type="module">
import * as THREE from 'three'; window.__SOLDIER_BASE = '/assets/soldiers/';
import { SoldierModel, preloadSoldiers } from '../index.js';
const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x8fa3b8);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.03, 200);
scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x6b5a45, 1.2));
const sun = new THREE.DirectionalLight(0xfff1dd, 2.6); sun.position.set(4, 8, 3); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -4; sun.shadow.camera.right = 4; sun.shadow.camera.top = 4; sun.shadow.camera.bottom = -4; scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x7a7468, roughness: 1 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const ctx = { renderer, camera, scene };
await preloadSoldiers(renderer);
const n = +(q.get('n') || 1), bots = [];
if (q.has('nonorm') || q.has('noao')) { const seen = new Set(); const fix = () => scene.traverse(o => { if (o.isMesh && o.material && !seen.has(o.material)) { seen.add(o.material); if (q.has('nonorm')) o.material.normalMap = null; if (q.has('noao')) { o.material.aoMap = null; o.material.map = null; } o.material.needsUpdate = true; } }); setTimeout(()=>{},0); window.__fix = fix; }
for (let i = 0; i < n; i++) { const m = new SoldierModel(i % 2 ? 'DEF' : 'ATK', ctx); scene.add(m.root); bots.push(m); }
const st = { speed: +(q.get('speed') || 0), crouch: +(q.get('crouch') || 0), ready: +(q.get('ready') ?? 1), reload: +(q.get('reload') ?? -1), pitch: +(q.get('pitch') || 0), moveX: +(q.get('mx') || 0), moveZ: q.has('mz') ? +q.get('mz') : -1 };
const yaw = +(q.get('yaw') || 0), camA = +(q.get('cam') || 0.6), camD = +(q.get('dist') || 3.2), camY = +(q.get('cy') || 1.1);
camera.position.set(Math.sin(camA) * camD, camY + 0.25, Math.cos(camA) * camD); camera.lookAt(0, camY, 0);
let t = +(q.get('t') || 0.4);
bots.forEach((b, i) => { b._pos = new THREE.Vector3((i - (n - 1) / 2) * 1.2, 0, 0); });
const killAt = q.has('dead') ? 20 : -1;
const steps = Math.round(t / (1 / 60));
for (let k = 0; k < steps; k++) { if (k === killAt) bots.forEach(b => b.kill(+q.get('dead'))); bots.forEach(b => b.pose({ ...st, pos: b._pos, yaw, dt: 1 / 60, fired: q.has('fire') && k % 6 === 0 })); }
if (q.has('noshadow')) renderer.shadowMap.enabled = false; if (q.has('lod')) bots.forEach(b => { b.impl.lods.forEach((a, i) => a.forEach(m => m.visible = i === +q.get('lod'))); }); window.__fix?.(); renderer.render(scene, camera);
window.__boxes = []; bots[0].root.updateMatrixWorld(true); bots[0].root.traverse(o => { if (o.isMesh && o.visible) { const bb = new THREE.Box3(); if (o.isSkinnedMesh) { o.computeBoundingBox(); bb.copy(o.boundingBox).applyMatrix4(o.matrixWorld); } else bb.setFromObject(o); window.__boxes.push(o.name + ' ' + o.parent.name + ' ' + bb.min.toArray().map(v=>v.toFixed(2)) + ' / ' + bb.max.toArray().map(v=>v.toFixed(2)) + ' n=' + o.geometry.attributes.position.count); } });
{ const m = bots[0].impl.lods[0][0]; const pos = m.geometry.attributes.position, sk = m.geometry.attributes.skinIndex, sw = m.geometry.attributes.skinWeight; const v = new THREE.Vector3(); const fl = ['DEF-footL','DEF-footR'].map(n => m.skeleton.getBoneByName(n).getWorldPosition(new THREE.Vector3())); const bad = {}; let nb = 0;
for (let i = 0; i < pos.count; i++) { v.fromBufferAttribute(pos, i); const ry = v.y; m.applyBoneTransform(i, v); v.applyMatrix4(m.matrixWorld); let bi = 0, bw = 0; for (let q = 0; q < 4; q++) if (sw.getComponent(i,q) > bw) { bw = sw.getComponent(i,q); bi = sk.getComponent(i,q); } const bone = m.skeleton.bones[bi]; const bp = bone.getWorldPosition(new THREE.Vector3()); const rest = new THREE.Vector3().fromBufferAttribute(pos, i).applyMatrix4(m.bindMatrix).applyMatrix4(m.skeleton.boneInverses[bi]); const d = Math.abs(bp.distanceTo(v) - rest.length()); if (d > 0.06) { nb++; const k = [0,1,2,3].map(q => sw.getComponent(i,q) > 0.01 ? m.skeleton.bones[sk.getComponent(i,q)].name + ':' + sw.getComponent(i,q).toFixed(2) : '').join(' ') + ' resty=' + ry.toFixed(2); bad[k] = (bad[k]||0)+1; } }
window.__boxes.push('bad ' + nb + ' ' + JSON.stringify(Object.entries(bad).slice(0, 10))); }
{ const t0 = performance.now(); for (let k = 0; k < 120; k++) bots.forEach(b => b.pose({ ...st, pos: b._pos, yaw, dt: 1 / 60 })); window.__perf = (performance.now() - t0) / 120 / bots.length; }
window.__ready = true; window.__hd = bots[0].isHD;
</script></body></html>
